<!-- @format -->

@if (selectControl) {
  @if (['<>', '≤≥'].includes(operatorControl.value!)) {
    <mat-form-field
      class="ngx-datatable-date-filter"
      appearance="fill"
      [class.has-value]="
        (rangeGroup.value.from !== null && rangeGroup.value.from !== undefined) ||
        (rangeGroup.value.to !== null && rangeGroup.value.to !== undefined)
      ">
      <mat-label [innerHTML]="column.header | safeHtml"></mat-label>

      <lib-operator-select matPrefix [formControl]="operatorControl"></lib-operator-select>

      <mat-date-range-input [formGroup]="rangeGroup" [rangePicker]="rangePicker">
        <input matStartDate formControlName="from" [placeholder]="column.placeholder!" (blur)="onTouched()" />
        <input matEndDate formControlName="to" [placeholder]="column.placeholder!" (blur)="onTouched()" />
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="rangePicker"></mat-datepicker-toggle>
      <mat-date-range-picker #rangePicker></mat-date-range-picker>

      <button
        *ngIf="
          (rangeGroup.value.from !== null && rangeGroup.value.from !== undefined) ||
          (rangeGroup.value.to !== null && rangeGroup.value.to !== undefined)
        "
        mat-icon-button
        matSuffix
        size="small"
        [attr.aria-label]="datatableIntl.clearFilterLabel"
        (click)="clearRange()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  } @else {
    <mat-form-field
      class="ngx-datatable-date-filter"
      appearance="fill"
      [class.has-value]="selectControl.value !== null && selectControl.value !== undefined">
      <mat-label [innerHTML]="column.header | safeHtml"></mat-label>

      <lib-operator-select matPrefix [formControl]="operatorControl"></lib-operator-select>

      <input
        matInput
        [matDatepicker]="datePicker"
        [formControl]="selectControl"
        [placeholder]="column.placeholder!"
        (blur)="onTouched()" />
      <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>

      <button
        *ngIf="selectControl.value !== null && selectControl.value !== undefined"
        mat-icon-button
        matSuffix
        size="small"
        [attr.aria-label]="datatableIntl.clearFilterLabel"
        (click)="selectControl.setValue(undefined)">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  }
}
