<!-- @format -->

<div class="duration-segment-input" [class.duration-segment-input--disabled]="disabled">
  @if (showDays()) {
    <input
      #daysInput
      class="duration-segment-input__segment duration-segment-input__segment--days"
      [id]="daysInputId"
      [formControl]="daysControl"
      [placeholder]="focused ? '0' : ''"
      [attr.aria-describedby]="describedByIds"
      [attr.aria-label]="daysLabel"
      autocomplete="off"
      inputmode="numeric"
      (keydown)="onSegmentKeydown($event, 'days')" />
    <span class="duration-segment-input__unit" aria-hidden="true">{{ daysUnit }}</span>
  }
  <input
    #hoursInput
    class="duration-segment-input__segment duration-segment-input__segment--hours"
    [id]="hoursInputId"
    [formControl]="hoursControl"
    [placeholder]="visibleHoursPlaceholder"
    [attr.aria-describedby]="describedByIds"
    [attr.aria-label]="hoursLabel"
    autocomplete="off"
    inputmode="numeric"
    (keydown)="onSegmentKeydown($event, 'hours')" />

  @if (showDays()) {
    <span class="duration-segment-input__unit" aria-hidden="true">{{ hoursUnit }}</span>
  } @else {
    <span class="duration-segment-input__separator" aria-hidden="true">:</span>
  }

  <input
    #minutesInput
    class="duration-segment-input__segment duration-segment-input__segment--minutes"
    [id]="minutesInputId"
    [formControl]="minutesControl"
    [placeholder]="visibleMinutesPlaceholder"
    [attr.aria-describedby]="describedByIds"
    [attr.aria-label]="minutesLabel"
    autocomplete="off"
    inputmode="numeric"
    (keydown)="onSegmentKeydown($event, 'minutes')" />
  @if (showDays()) {
    <span class="duration-segment-input__unit" aria-hidden="true">{{ minutesUnit }}</span>
  }
</div>
